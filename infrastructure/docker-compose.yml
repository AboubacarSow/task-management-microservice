version: "3.9"

services:
  dispatcher-service:
    build:
      context: ..
      dockerfile: src/services/dispatcher-service/Dockerfile
    image: dispatcher-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - authentication-service
      - project-service
      - agent-service
      - user-service
    networks:
      - internal

  authentication-service:
    build:
      context: ..
      dockerfile: src/services/authentication-service/Dockerfile
    image: authentication-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - UserService__BaseUrl=http://user-service:5002
      - Elasticsearch__Uri=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - internal

  project-service:
    build:
      context: ..
      dockerfile: src/services/project-service/Dockerfile
    image: project-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseSettings__ConnectionStrings=mongodb://mongodb:27017
      - DatabaseSettings__Database=TaskManagementDb
      - DatabaseSettings__ProjectCollection=Projects
      - DatabaseSettings__TaskCollection=Tasks
      - Elasticsearch__Uri=http://elasticsearch:9200
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - internal

  agent-service:
    build:
      context: ..
      dockerfile: src/services/ai_agent_service/Dockerfile
    image: agent-service
    command: uvicorn src.services.ai_agent_service.app:app --host 0.0.0.0 --port 5001
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2 
      - DB_NAME=ai_agent_service
      - LOG_COLLECTION=log
      - AUTHORITY=http://authentication-service:5004

    depends_on:
      - mongodb
      - ollama
    networks:
      - internal

  user-service:
    build:
      context: ..
      dockerfile: src/services/user_service/Dockerfile
    image: user-service
    command: uvicorn src.services.user_service.main:app --host 0.0.0.0 --port 5002
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=user_service
      - USER_COLLECTION=users
      - AUTHORITY=http://authentication-service:5004

    depends_on:
      - mongodb
    networks:
      - internal

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - internal
  
  kibana:
    image: kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - internal
    depends_on:
      - elasticsearch

  filebeat:
    build:
      context: ./filebeat
      dockerfile: Dockerfile
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    networks:
      - internal
    depends_on:
      - elasticsearch

volumes:
  mongodb_data:
  elasticsearch_data:
  ollama_data:

networks:
  internal:
    driver: bridge
