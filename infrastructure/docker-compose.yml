version: "3.9"

services:
  dispatcher-service:
    build:
      context: .
      dockerfile: src/services/dispatcher-service/Dockerfile
    image: dispatcher-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - authentication-service
      - project-service
      - agent-service
      - user-service
    networks:
      - internal

  authentication-service:
    build:
      context: .
      dockerfile: src/services/authentication-service/Dockerfile
    image: authentication-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - UserService__BaseUrl=http://user-service:5002
      - Elasticsearch__Uri=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - internal

  project-service:
    build:
      context: .
      dockerfile: src/services/project-service/Dockerfile
    image: project-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseSettings__ConnectionStrings=mongodb://mongodb:27017
      - DatabaseSettings__Database=TaskManagementDb
      - DatabaseSettings__ProjectCollection=Projects
      - DatabaseSettings__TaskCollection=Tasks
      - Elasticsearch__Uri=http://elasticsearch:9200
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - internal

  agent-service:
    build:
      context: ./src/services/ai_agent_service
    image: agent-service
    command: uvicorn main:app --host 0.0.0.0 --port 5001
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2 
    depends_on:
      - mongodb
      - ollama
    networks:
      - internal

  user-service:
    build:
      context: ./src/services/user_service
    image: user-service
    command: uvicorn main:app --host 0.0.0.0 --port 5002
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - internal

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - internal

volumes:
  mongodb_data:
  elasticsearch_data:
  ollama_data:

networks:
  internal:
    driver: bridge
