apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "taskmanagement-logs-*"
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "log.level"
    editable: false
  
  - name: InfluxDB-k6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: false
    basicAuth: false
    jsonData:
      version: InfluxQL
      organization: taskmanagement
      dbName: k6
      httpMode: GET
      authType: token
    secureJsonData:
      token: supersecrettoken