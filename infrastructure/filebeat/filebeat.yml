filebeat.inputs:
  - type: filestream
    id: docker-logs
    paths:
      - /var/lib/docker/containers/*/*.log

    parsers:
      - container: ~

    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"


output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "taskmanagement-logs-%{+yyyy.MM}"

setup.kibana:
  host: "http://kibana:5601"

setup.ilm.enabled: false
setup.template.name: "taskmanagement-logs"
setup.template.pattern: "taskmanagement-logs-*"

